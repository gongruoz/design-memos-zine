    <section class="cover" aria-labelledby="cover-title">

        <p class="folio">设计备忘录 <span>/</span> 作品特刊</p>
        <h1 id="cover-title">新千年<br>设计备忘录<span class="punctuation">.</span></h1>
        <p class="cover-en" lang="en">Design Memos<br>for the Next Millennium</p>
        <p class="cover-dek">从身体的试探到一座城市的余温。沿着六个关键词，看设计怎样改变感知、环境和人与人相遇的条件。</p>
        <a class="cover-link" href="#contents">翻开这期 <span aria-hidden="true">↘</span></a>
      </div>
      <figure class="cover-figure">
        <!-- ImageGen cover prompt. Use case: illustration-story. Asset: original cover art for a high-design print zine about future design, perception, climate and technology. Wide landscape 3:2, edge-to-edge saturated ultramarine/cobalt blue risograph ink on vivid blue stock. One enormous finely detailed black-blue photographic solarized X-ray of a real open spruce pinecone at the center, canted diagonally upper-left to lower-right, its intricate scales unravel on the right into very fine etched optical diagrams and sweeping orbit curves. A single vivid acid yellow chartreuse paper disc, approximately a quarter of frame height, sits partially behind the cone in the upper-right, and a small rough chartreuse four-point star sits toward bottom right. Ink texture, black grain, beautiful etched details, dimensional and tactile, speculative natural-history cyanotype, sharp editorial crop. Full bleed blue edges. Strong striking silhouette and generous pockets of open blue around the specimen. No words, letters, numbers, symbols resembling text, border, framing, watermarks, people, mockup, or white background. -->
        <img class="cover-image" src="assets/cover.jpg" alt="深蓝色松果的鳞片延展成细密曲线，背后是一轮荧光黄圆盘" fetchpriority="high">
        <figcaption><span>封面图 · 松果鳞片的运动</span><span lang="en">COVER ART / 2026</span></figcaption>
      </figure>
    </section>
    <section class="contents" id="contents" aria-labelledby="contents-title">

        <span lang="en">CONTENTS</span>
